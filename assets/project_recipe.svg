<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="foodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140824"/>
      <stop offset="50%" stop-color="#220e3d"/>
      <stop offset="100%" stop-color="#0c0417"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#foodBg)"/>

  <!-- Search Bar Header -->
  <g transform="translate(60, 40)">
    <rect width="680" height="56" rx="28" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.5"/>
    <circle cx="36" cy="28" r="10" fill="none" stroke="#ec4899" stroke-width="2"/>
    <line x1="43" y1="35" x2="52" y2="44" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>
    <text x="72" y="34" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="15">Search dishes, cuisines, ingredients (TheMealDB REST API)...</text>
    <rect x="555" y="10" width="115" height="36" rx="18" fill="url(#btnGrad)"/>
    <text x="590" y="33" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">Search</text>
  </g>

  <!-- Recipe Cards Grid -->
  <!-- Card 1 -->
  <g transform="translate(65, 130)">
    <rect width="200" height="310" rx="16" fill="rgba(35, 18, 65, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
    <rect x="15" y="15" width="170" height="145" rx="12" fill="#381b5c"/>
    <circle cx="100" cy="85" r="45" fill="#f97316" opacity="0.25"/>
    <circle cx="100" cy="85" r="30" fill="#f97316"/>
    <text x="100" y="94" fill="#ffffff" font-size="28" text-anchor="middle">🍝</text>
    <rect x="18" y="175" width="65" height="20" rx="10" fill="rgba(249, 115, 22, 0.25)"/>
    <text x="32" y="189" fill="#fb923c" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10">ITALIAN</text>
    <text x="18" y="222" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16">Arrabiata Pasta</text>
    <text x="18" y="244" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Garlic and spicy tomato</text>
    <text x="18" y="280" fill="#ec4899" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">★ 4.9 • 20 mins</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(300, 130)">
    <rect width="200" height="310" rx="16" fill="rgba(35, 18, 65, 0.75)" stroke="rgba(236, 72, 153, 0.45)" stroke-width="1.8"/>
    <rect x="15" y="15" width="170" height="145" rx="12" fill="#381b5c"/>
    <circle cx="100" cy="85" r="45" fill="#ec4899" opacity="0.25"/>
    <circle cx="100" cy="85" r="30" fill="#ec4899"/>
    <text x="100" y="94" fill="#ffffff" font-size="28" text-anchor="middle">🍕</text>
    <rect x="18" y="175" width="75" height="20" rx="10" fill="rgba(236, 72, 153, 0.25)"/>
    <text x="28" y="189" fill="#f472b6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10">PIZZA BAKE</text>
    <text x="18" y="222" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16">Tuscan Pizza</text>
    <text x="18" y="244" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Oven-baked mozzarella</text>
    <text x="18" y="280" fill="#ec4899" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">★ 5.0 • 35 mins</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(535, 130)">
    <rect width="200" height="310" rx="16" fill="rgba(35, 18, 65, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
    <rect x="15" y="15" width="170" height="145" rx="12" fill="#381b5c"/>
    <circle cx="100" cy="85" r="45" fill="#3b82f6" opacity="0.25"/>
    <circle cx="100" cy="85" r="30" fill="#3b82f6"/>
    <text x="100" y="94" fill="#ffffff" font-size="28" text-anchor="middle">🥗</text>
    <rect x="18" y="175" width="65" height="20" rx="10" fill="rgba(59, 130, 246, 0.25)"/>
    <text x="30" y="189" fill="#60a5fa" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10">HEALTHY</text>
    <text x="18" y="222" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16">Greek Salad</text>
    <text x="18" y="244" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Feta cheese and olives</text>
    <text x="18" y="280" fill="#ec4899" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">★ 4.8 • 15 mins</text>
  </g>
</svg>
