<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040817"/>
      <stop offset="50%" stop-color="#0b1736"/>
      <stop offset="100%" stop-color="#060c20"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00bbf9"/>
      <stop offset="100%" stop-color="#9b5de5"/>
    </linearGradient>
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#aiBg)"/>

  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="rgba(56, 189, 248, 0.08)" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Left: 3D Holographic Neural Core Simulator -->
  <g transform="translate(220, 250)">
    <circle r="125" fill="none" stroke="rgba(0, 210, 255, 0.25)" stroke-dasharray="6,8"/>
    <circle r="95" fill="none" stroke="rgba(155, 93, 229, 0.4)" stroke-width="2"/>
    <circle r="65" fill="none" stroke="rgba(0, 245, 212, 0.6)" stroke-dasharray="4,6" stroke-width="1.5"/>
    
    <circle r="42" fill="url(#coreGrad)" opacity="0.3" filter="url(#coreGlow)"/>
    <circle r="28" fill="url(#coreGrad)" filter="url(#coreGlow)"/>

    <!-- Neural Wireframe Polygon -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#00d2ff" stroke-width="1.8"/>
    <polygon points="0,-38 32,-18 32,18 0,38 -32,18 -32,-18" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.7"/>

    <circle cx="0" cy="-60" r="5" fill="#00d2ff"/>
    <circle cx="52" cy="-30" r="5" fill="#9b5de5"/>
    <circle cx="52" cy="30" r="5" fill="#00f5d4"/>
    <circle cx="0" cy="60" r="5" fill="#00d2ff"/>
    <circle cx="-52" cy="30" r="5" fill="#9b5de5"/>
    <circle cx="-52" cy="-30" r="5" fill="#00f5d4"/>
  </g>

  <!-- Right: Production Metrics & RAG Citations Panel -->
  <g transform="translate(420, 85)">
    <!-- Document Status -->
    <rect width="330" height="85" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5"/>
    <circle cx="38" cy="42" r="18" fill="rgba(0, 210, 255, 0.15)"/>
    <path d="M30 44 L38 36 L46 44 M38 37 L38 48 M28 48 L48 48" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="70" y="36" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">Knowledge Base Loaded</text>
    <text x="70" y="56" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Gemini 3.8 Multimodal OCR • 100%</text>

    <!-- Vector Citation Result -->
    <rect y="105" width="330" height="120" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(155, 93, 229, 0.4)" stroke-width="1.5"/>
    <circle cx="38" cy="140" r="18" fill="rgba(155, 93, 229, 0.2)"/>
    <path d="M30 140 L36 146 L47 134" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <text x="70" y="136" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">Sub-0.002s BM25 Search</text>
    <text x="70" y="154" fill="#00d2ff" font-family="'JetBrains Mono', monospace" font-size="11">Page 1 • Exact Citation Match</text>
    <rect x="70" y="168" width="230" height="7" rx="3.5" fill="rgba(255,255,255,0.12)"/>
    <rect x="70" y="182" width="170" height="7" rx="3.5" fill="rgba(255,255,255,0.08)"/>
    <rect x="70" y="196" width="200" height="7" rx="3.5" fill="rgba(255,255,255,0.08)"/>

    <!-- Backend Status Bar -->
    <rect y="245" width="330" height="60" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1.5"/>
    <text x="24" y="272" fill="#4ade80" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">FastAPI Streaming Engine</text>
    <text x="24" y="290" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Uvicorn Port 8000 • Connected</text>
    <rect x="235" y="260" width="80" height="28" rx="14" fill="rgba(34, 197, 94, 0.15)" stroke="#4ade80" stroke-width="1"/>
    <text x="255" y="278" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">ACTIVE</text>
  </g>
</svg>
